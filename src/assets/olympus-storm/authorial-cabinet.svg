<svg xmlns="http://www.w3.org/2000/svg" width="941" height="1672" viewBox="0 0 941 1672" role="img" aria-labelledby="title desc">
  <title id="title">Olympus Storm authorial cabinet and symbol atlas</title>
  <desc id="desc">Original blue and gold storm-temple cabinet with seven original symbol illustrations positioned to preserve the existing reel crop contract.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#020916"/><stop offset=".35" stop-color="#09285e"/><stop offset=".72" stop-color="#041631"/><stop offset="1" stop-color="#010814"/></linearGradient>
    <radialGradient id="stormHalo" cx="50%" cy="42%" r="58%"><stop stop-color="#70e8ff" stop-opacity=".72"/><stop offset=".33" stop-color="#275edb" stop-opacity=".34"/><stop offset="1" stop-color="#03091a" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1a6"/><stop offset=".22" stop-color="#f8ca51"/><stop offset=".55" stop-color="#a86511"/><stop offset=".78" stop-color="#ffd66b"/><stop offset="1" stop-color="#6e3c09"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eefaff"/><stop offset=".36" stop-color="#83d9f5"/><stop offset=".66" stop-color="#2c6ab1"/><stop offset="1" stop-color="#d7f7ff"/></linearGradient>
