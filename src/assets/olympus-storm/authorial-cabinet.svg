    <radialGradient id="orbFill" cx="38%" cy="32%" r="70%"><stop stop-color="#dffcff"/><stop offset=".2" stop-color="#66e8ff"/><stop offset=".5" stop-color="#2d67df"/><stop offset=".76" stop-color="#5a22a9"/><stop offset="1" stop-color="#08152e"/></radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0c3165"/><stop offset=".45" stop-color="#041a3c"/><stop offset="1" stop-color="#020a1b"/></linearGradient>
    <pattern id="stars" width="73" height="73" patternUnits="userSpaceOnUse"><circle cx="9" cy="17" r="1.1" fill="#bcecff" opacity=".5"/><circle cx="47" cy="8" r=".8" fill="#fff6c7" opacity=".55"/><circle cx="61" cy="49" r="1.2" fill="#7ce8ff" opacity=".3"/><circle cx="28" cy="58" r=".6" fill="#fff" opacity=".55"/></pattern>
