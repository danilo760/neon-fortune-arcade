name: Apply Pass 4 Cabinet Row Fix

on:
  push:
    branches:
      - art/golden-tiger-cabinet-pass4-2026-09-10
    paths:
      - .github/workflows/apply-pass4-layout-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/golden-tiger-cabinet-pass4-2026-09-10
          fetch-depth: 0
      - name: Apply layout fix
        run: patch -p1 --forward < .step4-layout-fix.patch
      - name: Commit clean layout fix
        run: |
          git config user.name "danilo760"
          git config user.email "62104537+danilo760@users.noreply.github.com"
          git rm .step4-layout-fix.patch .github/workflows/apply-pass4-layout-fix.yml
          git add src/components/arcade/GoldenTigerCommercial.css
          git commit -m "fix: pin Golden Tiger commercial cabinet rows"
          git push origin HEAD:art/golden-tiger-cabinet-pass4-2026-09-10
