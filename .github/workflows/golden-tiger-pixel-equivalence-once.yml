name: Golden Tiger Pixel Equivalence Once

on:
  push:
    branches:
      - feature/mx44-tigrinho-integration
    paths:
      - ".github/workflows/golden-tiger-pixel-equivalence-once.yml"

permissions:
  contents: read

jobs:
  pixel-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Create baseline worktree
        run: git worktree add --detach /tmp/gt-before 9ffcda8944564e034fde7a5413e9d64599020621

      - name: Build baseline
        working-directory: /tmp/gt-before
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build consolidated branch
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Detect Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version

      - name: Start both production servers and Chrome
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/gt-before && PORT=3101 node .output/server/index.mjs > /tmp/gt-before.log 2>&1) &
          echo $! > /tmp/gt-before.pid
          (PORT=3102 node .output/server/index.mjs > /tmp/gt-after.log 2>&1) &
          echo $! > /tmp/gt-after.pid
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir=/tmp/gt-pixel-chrome about:blank > /tmp/gt-chrome.log 2>&1 &
          echo $! > /tmp/gt-chrome.pid
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3101/game/golden-tiger >/dev/null \
              && curl -fsS http://127.0.0.1:3102/game/golden-tiger >/dev/null \
              && curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gt-before.log /tmp/gt-after.log /tmp/gt-chrome.log
          exit 1

      - name: Capture deterministic before and after screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/golden-tiger-pixel-equivalence/before artifacts/golden-tiger-pixel-equivalence/after
          cat > /tmp/gt-pixel-compare.mjs <<'NODE'
          import { writeFile } from "node:fs/promises";

          const cdpUrl = "http://127.0.0.1:9222";
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          class CdpClient {
            constructor(url) { this.url = url; this.id = 0; this.pending = new Map(); this.socket = null; }
            async connect() {
              this.socket = new WebSocket(this.url);
              await new Promise((resolve, reject) => {
                const timer = setTimeout(() => reject(new Error("CDP timeout")), 8000);
                this.socket.addEventListener("open", () => { clearTimeout(timer); resolve(); }, { once: true });
                this.socket.addEventListener("error", () => { clearTimeout(timer); reject(new Error("CDP websocket error")); }, { once: true });
              });
              this.socket.addEventListener("message", (event) => {
                const msg = JSON.parse(String(event.data));
                if (!msg.id) return;
                const pending = this.pending.get(msg.id);
                if (!pending) return;
                this.pending.delete(msg.id);
                if (msg.error) pending.reject(new Error(`${pending.method}: ${msg.error.message}`));
                else pending.resolve(msg.result);
              });
            }
            send(method, params = {}) {
              const id = ++this.id;
              return new Promise((resolve, reject) => {
                this.pending.set(id, { resolve, reject, method });
                this.socket.send(JSON.stringify({ id, method, params }));
              });
            }
            close() { this.socket?.close(); }
          }

          async function createTarget() {
            const response = await fetch(`${cdpUrl}/json/new?${encodeURIComponent("about:blank")}`, { method: "PUT" });
            if (!response.ok) throw new Error(`target ${response.status}`);
            return response.json();
          }
          async function closeTarget(id) { await fetch(`${cdpUrl}/json/close/${id}`).catch(() => undefined); }
          async function evaluate(client, expression) {
            const result = await client.send("Runtime.evaluate", { expression, returnByValue: true, awaitPromise: true });
            if (result.exceptionDetails) throw new Error(JSON.stringify(result.exceptionDetails));
            return result.result?.value;
          }

          const seedScript = `(() => {
            let seed = 0x44aa7711;
            Math.random = () => {
              seed = (seed + 0x6D2B79F5) | 0;
              let t = seed;
              t = Math.imul(t ^ (t >>> 15), t | 1);
              t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
          })();`;

          async function capture(baseUrl, viewport, path) {
            const target = await createTarget();
            const client = new CdpClient(target.webSocketDebuggerUrl);
            try {
              await client.connect();
              await client.send("Page.enable");
              await client.send("Runtime.enable");
              await client.send("Emulation.setDeviceMetricsOverride", {
                width: viewport.width, height: viewport.height, deviceScaleFactor: 1,
                mobile: viewport.mobile, screenWidth: viewport.width, screenHeight: viewport.height,
              });
              await client.send("Emulation.setPageScaleFactor", { pageScaleFactor: 1 });
              await client.send("Emulation.setEmulatedMedia", {
                media: "screen",
                features: [{ name: "prefers-reduced-motion", value: "reduce" }],
              });
              await client.send("Page.addScriptToEvaluateOnNewDocument", { source: seedScript });
              await client.send("Page.navigate", { url: `${baseUrl}/game/golden-tiger` });

              let ready = false;
              for (let attempt = 0; attempt < 50; attempt += 1) {
                await sleep(100);
                ready = await evaluate(client, `Boolean(document.querySelector('.gt-hw-machine') && document.querySelectorAll('.gt-hw-grid > .gt-hw-cell').length === 9)`).catch(() => false);
                if (ready) break;
              }
              if (!ready) throw new Error(`Golden Tiger did not mount at ${baseUrl}`);

              await evaluate(client, `(async () => {
                await document.fonts.ready;
                await Promise.all([...document.images].map((img) => img.complete ? Promise.resolve() : new Promise((resolve) => { img.addEventListener('load', resolve, {once:true}); img.addEventListener('error', resolve, {once:true}); })));
                let style = document.getElementById('pixel-freeze');
                if (!style) { style = document.createElement('style'); style.id = 'pixel-freeze'; document.head.appendChild(style); }
                style.textContent = '*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important;}';
                document.querySelectorAll('*').forEach((el) => el.getAnimations().forEach((animation) => { try { animation.pause(); animation.currentTime = 0; } catch {} }));
                window.scrollTo(0,0);
                return true;
              })()`);
              await sleep(250);
              const result = await client.send("Page.captureScreenshot", { format: "png", fromSurface: true, captureBeyondViewport: false });
              await writeFile(path, Buffer.from(result.data, "base64"));
            } finally {
              client.close();
              await closeTarget(target.id);
            }
          }

          const viewports = [
            { width: 360, height: 800, mobile: true, name: "360x800" },
            { width: 390, height: 844, mobile: true, name: "390x844" },
            { width: 430, height: 932, mobile: true, name: "430x932" },
            { width: 1366, height: 768, mobile: false, name: "1366x768" },
          ];
          for (const viewport of viewports) {
            await capture("http://127.0.0.1:3101", viewport, `artifacts/golden-tiger-pixel-equivalence/before/${viewport.name}.png`);
            await capture("http://127.0.0.1:3102", viewport, `artifacts/golden-tiger-pixel-equivalence/after/${viewport.name}.png`);
          }
          NODE
          node /tmp/gt-pixel-compare.mjs

      - name: Require byte-identical deterministic screenshots
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          : > artifacts/golden-tiger-pixel-equivalence/checksums.txt
          for before in artifacts/golden-tiger-pixel-equivalence/before/*.png; do
            name="$(basename "$before")"
            after="artifacts/golden-tiger-pixel-equivalence/after/$name"
            echo "=== $name ===" | tee -a artifacts/golden-tiger-pixel-equivalence/checksums.txt
            sha256sum "$before" "$after" | tee -a artifacts/golden-tiger-pixel-equivalence/checksums.txt
            if cmp -s "$before" "$after"; then
              echo "BYTE_IDENTICAL=YES" | tee -a artifacts/golden-tiger-pixel-equivalence/checksums.txt
            else
              echo "BYTE_IDENTICAL=NO" | tee -a artifacts/golden-tiger-pixel-equivalence/checksums.txt
              failures=$((failures + 1))
            fi
          done
          test "$failures" -eq 0

      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-tiger-pixel-equivalence
          path: artifacts/golden-tiger-pixel-equivalence/
          retention-days: 7

      - name: Stop processes
        if: always()
        shell: bash
        run: |
          for f in /tmp/gt-before.pid /tmp/gt-after.pid /tmp/gt-chrome.pid; do
            [ ! -f "$f" ] || kill "$(cat "$f")" 2>/dev/null || true
          done
