name: Apply Golden 2D Reels Fix

on:
  push:
    branches:
      - fix/arcade-post-playtest-2026-09-08
    paths:
      - ".github/workflows/apply-golden-2d-reels-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/arcade-post-playtest-2026-09-08

      - name: Remove forced 3D reel layers
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/components/arcade/GoldenTigerReference.tsx")
          source = path.read_text()

          required = [
              ('translate3d(0, ${-finalOffset}px, 0)', 'translateY(${-finalOffset}px)'),
              ('translate3d(0, ${-offset}px, 0)', 'translateY(${-offset}px)'),
              ('transform: "translate3d(0, 0, 0)"', 'transform: "translateY(0)"'),
          ]
          for old, new in required:
              if old not in source:
                  raise SystemExit("Golden reel anchor missing: " + old)
              source = source.replace(old, new)

          # Older revisions added a JS blur during braking. PresentationSafe.css
          # already disables it, but remove any remaining assignment at source
          # without depending on its exact constants/spacing.
          source = re.sub(
              r'^\s*track\.style\.filter\s*=\s*`blur\([^\n]+\n',
              '',
              source,
              flags=re.MULTILINE,
          )
          path.write_text(source)

      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-golden-2d-reels-fix.yml

      - name: Commit reel fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git add src/components/arcade/GoldenTigerReference.tsx .github/workflows/apply-golden-2d-reels-fix.yml
          git commit -m "fix: render Golden reels without forced 3D layers"
          git push origin HEAD:fix/arcade-post-playtest-2026-09-08
