name: Apply Golden Tiger Pass 5 Fix

on:
  push:
    branches:
      - polish/golden-tiger-pass5-av-sync-2026-09-10
    paths:
      - .github/workflows/apply-golden-tiger-pass5-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/golden-tiger-pass5-av-sync-2026-09-10
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply presentation fix
        run: |
          patch -p1 --forward < .pass5-fix.patch
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Tests
        run: bun run test
      - name: Typecheck
        run: bun run typecheck
      - name: Production build
        run: bun run build
      - name: Commit validated fix
        run: |
          git config user.name "danilo760"
          git config user.email "62104537+danilo760@users.noreply.github.com"
          git rm .pass5-fix.patch .github/workflows/apply-golden-tiger-pass5-fix.yml
          git add src/components/arcade/GoldenTigerPremium.tsx scripts/goldenTigerDesktopSpinQa.mjs
          git commit -m "fix: clear Golden Tiger win highlight after round"
          git push origin HEAD:polish/golden-tiger-pass5-av-sync-2026-09-10
