name: Golden Tiger Step 1 Apply

on:
  push:
    branches:
      - art/premium-direction-2026-09-09
    paths:
      - .github/workflows/golden-tiger-step1-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/premium-direction-2026-09-09
      - name: Apply Step 1 patch
        shell: bash
        run: |
          cat > /tmp/golden-tiger-step1.diff <<'PATCH'
          --- a/src/components/arcade/GoldenTigerPremium.tsx
          +++ b/src/components/arcade/GoldenTigerPremium.tsx
          @@ -11,6 +11,7 @@
             runPurchasedFortuneFeature,
           } from "@/lib/arcade/goldenTigerBonusBuy";
           import { playGoldenTigerAudio } from "@/lib/arcade/goldenTigerAudio";
          +import { GoldenTigerClock } from "@/lib/arcade/goldenTigerClock";
           import {
             FORTUNE_FEATURE_FULL_GRID_MULTIPLIER,
             rollFortuneFeatureTrigger,
          PATCH
