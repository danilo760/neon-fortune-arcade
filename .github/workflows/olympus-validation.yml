name: Olympus validation

on:
  push:
    branches:
      - codex/olympus-complete-refinement

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Simulate Olympus
        run: bun scripts/simulate-olympus.ts
        env:
          SPINS: 250000
