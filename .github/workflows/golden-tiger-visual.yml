name: Golden Tiger Visual

on:
  pull_request:
    paths:
      - "src/components/arcade/GoldenTigerReference.tsx"
      - "src/components/arcade/GoldenTigerReference.css"
      - "src/components/arcade/GoldenTigerPresentation.css"
      - "src/components/arcade/GoldenTigerPresentationSafe.css"
      - "src/components/arcade/GoldenTigerMediaRig.css"
      - "src/components/arcade/golden-tiger/**"
      - "src/assets/golden-tiger/**"
      - "src/lib/arcade/goldenTiger*.ts"
      - "src/lib/arcade/adaptiveScore.ts"
      - "src/routes/game/$slug.tsx"
      - "scripts/goldenTigerVisualQa.mjs"
      - "scripts/goldenTigerDesktopSpinQa.mjs"
      - "scripts/goldenTigerSpecialStateQa.mjs"
      - "scripts/goldenTigerCompositionGuard.mjs"
      - ".github/workflows/golden-tiger-visual.yml"
  workflow_dispatch:

jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_GOLDEN_TIGER_VISUAL_QA: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build

      - name: Detect Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium binary available on the runner" >&2
            exit 1
          fi
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version

      - name: Start production server
        shell: bash
        run: |
          set -euo pipefail
          PORT=3000 node .output/server/index.mjs > golden-tiger-server.log 2>&1 &
          echo $! > /tmp/golden-tiger-server.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/game/golden-tiger >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat golden-tiger-server.log
          exit 1

      - name: Start headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/golden-tiger-chrome \
            about:blank > golden-tiger-chrome.log 2>&1 &
          echo $! > /tmp/golden-tiger-chrome.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat golden-tiger-chrome.log
          exit 1

      - name: Audit mobile viewports
        run: node scripts/goldenTigerVisualQa.mjs

      - name: Audit desktop spin sequence
        run: node scripts/goldenTigerDesktopSpinQa.mjs

      - name: Start visible Chrome compositor session
        shell: bash
        run: |
          set -euo pipefail
          command -v Xvfb >/dev/null || { echo "Xvfb unavailable" >&2; exit 1; }
          Xvfb :99 -screen 0 1363x936x24 -nolisten tcp > golden-tiger-xvfb.log 2>&1 &
          echo $! > /tmp/golden-tiger-xvfb.pid
          export DISPLAY=:99
          "$CHROME" \
            --no-sandbox \
            --disable-dev-shm-usage \
            --window-size=1363,936 \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9232 \
            --user-data-dir=/tmp/golden-tiger-visible-chrome \
            about:blank > golden-tiger-visible-chrome.log 2>&1 &
          echo $! > /tmp/golden-tiger-visible-chrome.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9232/json/version >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat golden-tiger-visible-chrome.log
          exit 1

      - name: Audit visible desktop compositor
        env:
          CHROME_CDP_URL: http://127.0.0.1:9232
          GOLDEN_TIGER_QA_DIR: artifacts/golden-tiger-visible
        run: node scripts/goldenTigerDesktopSpinQa.mjs

      - name: Stop visible Chrome compositor session
        if: always()
        shell: bash
        run: |
          [ ! -f /tmp/golden-tiger-visible-chrome.pid ] || kill "$(cat /tmp/golden-tiger-visible-chrome.pid)" 2>/dev/null || true
          [ ! -f /tmp/golden-tiger-xvfb.pid ] || kill "$(cat /tmp/golden-tiger-xvfb.pid)" 2>/dev/null || true

      - name: Audit special states
        run: node scripts/goldenTigerSpecialStateQa.mjs

      - name: Guard mobile composition
        run: node scripts/goldenTigerCompositionGuard.mjs

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-tiger-visual-qa
          path: |
            artifacts/golden-tiger/
            artifacts/golden-tiger-visible/
            src/assets/golden-tiger/tiger-pose-atlas.webp
            golden-tiger-server.log
            golden-tiger-chrome.log
            golden-tiger-visible-chrome.log
            golden-tiger-xvfb.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop processes
        if: always()
        shell: bash
        run: |
          [ ! -f /tmp/golden-tiger-visible-chrome.pid ] || kill "$(cat /tmp/golden-tiger-visible-chrome.pid)" 2>/dev/null || true
          [ ! -f /tmp/golden-tiger-xvfb.pid ] || kill "$(cat /tmp/golden-tiger-xvfb.pid)" 2>/dev/null || true
          [ ! -f /tmp/golden-tiger-chrome.pid ] || kill "$(cat /tmp/golden-tiger-chrome.pid)" 2>/dev/null || true
          [ ! -f /tmp/golden-tiger-server.pid ] || kill "$(cat /tmp/golden-tiger-server.pid)" 2>/dev/null || true
