name: Perf Olympus profile

on:
  push:
    branches:
      - perf/olympus-render-cost

jobs:
  profile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Profile Olympus Auto at 390x844 / CPU 4x
        env:
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cp scripts/profile-olympus-cdp.mjs /tmp/profile-olympus-cdp.mjs

          inject_counters() {
            python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/arcade/OlympusStormReference.tsx')
          text = path.read_text()
          main = 'export function OlympusStormReference() {\n'
          main_injected = '''export function OlympusStormReference() {\n  if (typeof window !== "undefined") {\n    const perfWindow = window as Window & { __olympusRenderCount?: number; __olympusSymbolRenderCount?: number };\n    perfWindow.__olympusRenderCount = (perfWindow.__olympusRenderCount ?? 0) + 1;\n  }\n'''
          if main not in text:
              raise SystemExit('Olympus main marker missing')
          text = text.replace(main, main_injected, 1)

          markers = [
              'function ReferenceSymbol({ id, src }: { id: OlympusSymbolId; src: string }) {\n',
              'const ReferenceSymbol = memo(function ReferenceSymbol({ id, src }: { id: OlympusSymbolId; src: string }) {\n',
          ]
          symbol_injection = '''  if (typeof window !== "undefined") {\n    const perfWindow = window as Window & { __olympusSymbolRenderCount?: number };\n    perfWindow.__olympusSymbolRenderCount = (perfWindow.__olympusSymbolRenderCount ?? 0) + 1;\n  }\n'''
          for marker in markers:
              if marker in text:
                  text = text.replace(marker, marker + symbol_injection, 1)
                  break
          else:
              raise SystemExit('Olympus symbol marker missing')
          path.write_text(text)
          PY
          }

          start_runtime() {
            bun run dev -- --host 127.0.0.1 --port 4173 >/tmp/olympus-vite.log 2>&1 &
            VITE_PID=$!
            CHROME_BIN=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
            "$CHROME_BIN" --headless=new --no-sandbox --disable-dev-shm-usage --autoplay-policy=no-user-gesture-required --remote-debugging-port=9222 --user-data-dir=/tmp/chrome-olympus about:blank >/tmp/olympus-chrome.log 2>&1 &
            CHROME_PID=$!
            for i in $(seq 1 120); do
              if curl -sf http://127.0.0.1:9222/json/version >/dev/null && curl -sf http://127.0.0.1:4173/game/olympus-storm >/dev/null; then return; fi
              sleep .25
            done
            cat /tmp/olympus-vite.log || true
            cat /tmp/olympus-chrome.log || true
            exit 1
          }

          stop_runtime() {
            kill "$VITE_PID" "$CHROME_PID" 2>/dev/null || true
            wait "$VITE_PID" 2>/dev/null || true
            wait "$CHROME_PID" 2>/dev/null || true
            rm -rf /tmp/chrome-olympus
          }

          profile_ref() {
            REF="$1"
            LABEL="$2"
            git checkout --force "$REF"
            bun install --frozen-lockfile >/dev/null
            inject_counters
            start_runtime
            node /tmp/profile-olympus-cdp.mjs >"/tmp/$LABEL.json"
            stop_runtime
            echo "$LABEL=$(cat /tmp/$LABEL.json)"
          }

          profile_ref b120755f57ab24bf2a7fab239d467057f0c07050 before
          profile_ref "$AFTER_SHA" after

          node - <<'NODE'
          const fs = require('fs');
          const before = JSON.parse(fs.readFileSync('/tmp/before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('/tmp/after.json', 'utf8'));
          const pct = (a, b) => a ? ((b - a) / a) * 100 : 0;
          console.log('=== OLYMPUS PERF COMPARISON ===');
          console.log(JSON.stringify({ before, after, delta: {
            avgFpsPct: pct(before.avgFps, after.avgFps),
            renderCountPct: pct(before.renderCount, after.renderCount),
            symbolRenderCountPct: pct(before.symbolRenderCount, after.symbolRenderCount),
            taskDurationPct: pct(before.taskDuration, after.taskDuration),
            scriptDurationPct: pct(before.scriptDuration, after.scriptDuration),
            longTasks: after.longTasks - before.longTasks,
            heapDeltaBytes: after.jsHeapDelta - before.jsHeapDelta,
          }}, null, 2));
          NODE
