name: Apply Mines persistence patch

on:
  push:
    branches:
      - fix/arcade-post-playtest-2026-09-08
    paths:
      - ".github/workflows/apply-mines-persistence-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/arcade-post-playtest-2026-09-08
      - name: Patch Mines round lifecycle
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/components/arcade/MinesGame.tsx")
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f"missing {label}")
              text = text.replace(old, new, 1)

          replace_once(
              'import { playMinesSound } from "@/lib/arcade/minesSound";\n',
              'import {\n  clearMinesRoundSnapshot,\n  loadMinesRoundSnapshot,\n  saveMinesRoundSnapshot,\n} from "@/lib/arcade/minesRoundPersistence";\nimport { playMinesSound } from "@/lib/arcade/minesSound";\n',
              "persistence import",
          )

          replace_once(
              '  const revealBusyRef = useRef(false);\n',
              '  const revealBusyRef = useRef(false);\n  const startedAtRef = useRef(0);\n',
              "startedAt ref",
          )

          ambience = '  useEffect(() => {\n    setGameAmbience("mines", soundEnabled);\n'
          restore = '''  useEffect(() => {
            const snapshot = loadMinesRoundSnapshot();
            if (!snapshot) return;

            const restored = new Set(snapshot.revealed);
            setBet(snapshot.bet);
            setMineCount(snapshot.mineCount);
            setMineField(snapshot.mineField);
            setRevealed(restored);
            setLastPayout(0);
            setLastRoundSafeCells(0);
            setLastRoundMultiplier(1);
            setLastSafeReveal(null);
            setTriggeredMine(null);
            setOpeningIndex(null);
            setRevealPhase("idle");
            setPossibleWinDuration(0);
            setDisplayedPossibleWin(Math.round(snapshot.bet * minesMultiplier(snapshot.mineCount, restored.size)));
            setStatus("playing");
            revealedRef.current = restored;
            settledRef.current = false;
            roundActiveRef.current = true;
            revealBusyRef.current = false;
            startedAtRef.current = snapshot.startedAt;
          }, []);

'''.replace('          ', '')
          replace_once(ambience, restore + ambience, "restore effect")

          replace_once(
              '    setMineField(createMineField(createRng(), mineCount));\n',
              '''    const nextMineField = createMineField(createRng(), mineCount);
            const startedAt = Date.now();
            startedAtRef.current = startedAt;
            saveMinesRoundSnapshot({
              version: 1,
              bet,
              mineCount,
              mineField: nextMineField,
              revealed: [],
              startedAt,
            });
            setMineField(nextMineField);
'''.replace('          ', ''),
              "new round snapshot",
          )

          cashout_marker = '    playMinesSound("cashout", soundEnabled);\n\n    try {\n'
          cashout_settlement = '''    playMinesSound("cashout", soundEnabled);

            arcadeActions.credit(payout);
            arcadeActions.recordRound({
              slug: "neon-mines",
              gameName: "Neon Mines",
              bet,
              payout,
              multiplier: finalMultiplier,
              note: `${safeCells} casas seguras`,
            });
            clearMinesRoundSnapshot();
            startedAtRef.current = 0;

            try {
'''.replace('          ', '')
          replace_once(cashout_marker, cashout_settlement, "cashout economic settlement")

          old_cashout_record = '''      arcadeActions.credit(payout);
            arcadeActions.recordRound({
              slug: "neon-mines",
              gameName: "Neon Mines",
              bet,
              payout,
              multiplier: finalMultiplier,
              note: `${safeCells} casas seguras`,
            });
'''.replace('          ', '')
          replace_once(old_cashout_record, '', "old cashout settlement")

          mine_marker = '''      if (mineSet.has(index)) {
            const safeCells = revealedRef.current.size;
            const reachedMultiplier = minesMultiplier(mineCount, safeCells);
            setTriggeredMine(index);
            setRevealPhase("danger");
'''.replace('          ', '')
          mine_settlement = '''      if (mineSet.has(index)) {
            const safeCells = revealedRef.current.size;
            const reachedMultiplier = minesMultiplier(mineCount, safeCells);
            setTriggeredMine(index);
            settledRef.current = true;
            roundActiveRef.current = false;
            arcadeActions.recordRound({
              slug: "neon-mines",
              gameName: "Neon Mines",
              bet,
              payout: 0,
              multiplier: 0,
              note: `Mina encontrada após ${safeCells} casa(s) segura(s)`,
            });
            clearMinesRoundSnapshot();
            startedAtRef.current = 0;
            setRevealPhase("danger");
'''.replace('          ', '')
          replace_once(mine_marker, mine_settlement, "mine economic settlement")

          old_mine_refs = '''
            settledRef.current = true;
            roundActiveRef.current = false;
            playMinesSound("mineArm", soundEnabled);
'''.replace('          ', '')
          replace_once(old_mine_refs, '\n      playMinesSound("mineArm", soundEnabled);\n', "old mine refs")

          old_loss_record = '''        arcadeActions.recordRound({
              slug: "neon-mines",
              gameName: "Neon Mines",
              bet,
              payout: 0,
              multiplier: 0,
              note: `Mina encontrada após ${safeCells} casa(s) segura(s)`,
            });
'''.replace('          ', '')
          replace_once(old_loss_record, '', "old loss record")

          safe_marker = '      revealedRef.current = next;\n      setRevealed(next);\n'
          safe_persist = '''      revealedRef.current = next;
            setRevealed(next);
            const startedAt = startedAtRef.current || Date.now();
            startedAtRef.current = startedAt;
            saveMinesRoundSnapshot({
              version: 1,
              bet,
              mineCount,
              mineField,
              revealed: [...next],
              startedAt,
            });
'''.replace('          ', '')
          replace_once(safe_marker, safe_persist, "safe reveal persistence")

          path.write_text(text)
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-mines-persistence-patch.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/arcade/MinesGame.tsx .github/workflows/apply-mines-persistence-patch.yml
          git commit -m "fix: persist active Mines rounds across navigation"
          git push origin HEAD:fix/arcade-post-playtest-2026-09-08
