name: Apply Mines Real Persistence Fix

on:
  push:
    branches:
      - fix/arcade-post-playtest-2026-09-08
    paths:
      - ".github/workflows/apply-mines-real-persistence-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/arcade-post-playtest-2026-09-08

      - name: Patch Mines persistence
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/components/arcade/MinesGame.tsx")
          source = path.read_text()

          source = source.replace(
              'import { arcadeActions, useArcade } from "@/lib/arcade/store";',
              'import { arcadeActions, hydrateFromStorage, useArcade } from "@/lib/arcade/store";',
              1,
          )

          old_refs = '''  const settledRef = useRef(true);\n  const roundActiveRef = useRef(false);\n  const revealedRef = useRef<Set<number>>(new Set());\n  const revealBusyRef = useRef(false);\n  const startedAtRef = useRef(0);\n'''
          new_refs = '''  const settledRef = useRef(true);\n  const roundActiveRef = useRef(false);\n  const revealedRef = useRef<Set<number>>(new Set());\n  const revealBusyRef = useRef(false);\n  const startedAtRef = useRef(0);\n  const betRef = useRef(bet);\n  const mineCountRef = useRef(mineCount);\n  const mineFieldRef = useRef<number[]>(mineField);\n'''
          if old_refs not in source:
              raise SystemExit("Mines refs anchor not found")
          source = source.replace(old_refs, new_refs, 1)

          old_restore = '''  useEffect(() => {\n    const snapshot = loadMinesRoundSnapshot();\n    if (!snapshot) return;\n\n    const restored = new Set(snapshot.revealed);\n    setBet(snapshot.bet);\n    setMineCount(snapshot.mineCount);\n    setMineField(snapshot.mineField);\n    setRevealed(restored);\n    setLastPayout(0);\n    setLastRoundSafeCells(0);\n    setLastRoundMultiplier(1);\n    setLastSafeReveal(null);\n    setTriggeredMine(null);\n    setOpeningIndex(null);\n    setRevealPhase("idle");\n    setPossibleWinDuration(0);\n    setDisplayedPossibleWin(Math.round(snapshot.bet * minesMultiplier(snapshot.mineCount, restored.size)));\n    setStatus("playing");\n    revealedRef.current = restored;\n    settledRef.current = false;\n    roundActiveRef.current = true;\n    revealBusyRef.current = false;\n    startedAtRef.current = snapshot.startedAt;\n  }, []);\n'''
          new_restore = '''  useEffect(() => {\n    hydrateFromStorage();\n    const snapshot = loadMinesRoundSnapshot();\n    if (!snapshot) return;\n\n    const restored = new Set(snapshot.revealed);\n    betRef.current = snapshot.bet;\n    mineCountRef.current = snapshot.mineCount;\n    mineFieldRef.current = [...snapshot.mineField];\n    setBet(snapshot.bet);\n    setMineCount(snapshot.mineCount);\n    setMineField(snapshot.mineField);\n    setRevealed(restored);\n    setLastPayout(0);\n    setLastRoundSafeCells(0);\n    setLastRoundMultiplier(1);\n    setLastSafeReveal(null);\n    setTriggeredMine(null);\n    setOpeningIndex(null);\n    setRevealPhase("idle");\n    setPossibleWinDuration(0);\n    setDisplayedPossibleWin(Math.round(snapshot.bet * minesMultiplier(snapshot.mineCount, restored.size)));\n    setStatus("playing");\n    revealedRef.current = restored;\n    settledRef.current = false;\n    roundActiveRef.current = true;\n    revealBusyRef.current = false;\n    startedAtRef.current = snapshot.startedAt;\n  }, []);\n\n  useEffect(() => { betRef.current = bet; }, [bet]);\n  useEffect(() => { mineCountRef.current = mineCount; }, [mineCount]);\n  useEffect(() => { mineFieldRef.current = mineField; }, [mineField]);\n\n  useEffect(() => {\n    const persistActiveRound = () => {\n      if (!roundActiveRef.current || settledRef.current || startedAtRef.current <= 0) return;\n      const activeMineField = mineFieldRef.current;\n      if (activeMineField.length !== mineCountRef.current) return;\n      saveMinesRoundSnapshot({\n        version: 1,\n        bet: betRef.current,\n        mineCount: mineCountRef.current,\n        mineField: [...activeMineField],\n        revealed: [...revealedRef.current],\n        startedAt: startedAtRef.current,\n      });\n    };\n\n    window.addEventListener("pagehide", persistActiveRound);\n    return () => {\n      persistActiveRound();\n      window.removeEventListener("pagehide", persistActiveRound);\n    };\n  }, []);\n'''
          if old_restore not in source:
              raise SystemExit("Mines restore anchor not found")
          source = source.replace(old_restore, new_restore, 1)

          old_start = '''    const nextMineField = createMineField(createRng(), mineCount);\n    const startedAt = Date.now();\n    startedAtRef.current = startedAt;\n    saveMinesRoundSnapshot({\n      version: 1,\n      bet,\n      mineCount,\n      mineField: nextMineField,\n'''
          new_start = '''    const nextMineField = createMineField(createRng(), mineCount);\n    const startedAt = Date.now();\n    betRef.current = bet;\n    mineCountRef.current = mineCount;\n    mineFieldRef.current = [...nextMineField];\n    startedAtRef.current = startedAt;\n    saveMinesRoundSnapshot({\n      version: 1,\n      bet: betRef.current,\n      mineCount: mineCountRef.current,\n      mineField: [...mineFieldRef.current],\n'''
          if old_start not in source:
              raise SystemExit("Mines start anchor not found")
          source = source.replace(old_start, new_start, 1)

          old_safe = '''      saveMinesRoundSnapshot({\n        version: 1,\n        bet,\n        mineCount,\n        mineField,\n        revealed: [...next],\n        startedAt,\n      });\n'''
          new_safe = '''      saveMinesRoundSnapshot({\n        version: 1,\n        bet: betRef.current,\n        mineCount: mineCountRef.current,\n        mineField: [...mineFieldRef.current],\n        revealed: [...next],\n        startedAt,\n      });\n'''
          if old_safe not in source:
              raise SystemExit("Mines safe-save anchor not found")
          source = source.replace(old_safe, new_safe, 1)

          path.write_text(source)

      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-mines-real-persistence-fix.yml

      - name: Commit persistence fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git add src/components/arcade/MinesGame.tsx .github/workflows/apply-mines-real-persistence-fix.yml
          git commit -m "fix: restore Mines active rounds on real navigation"
          git push origin HEAD:fix/arcade-post-playtest-2026-09-08
