name: Apply Plinko post-playtest patch

on:
  push:
    branches:
      - fix/arcade-post-playtest-2026-09-08
    paths:
      - ".github/workflows/apply-plinko-post-playtest-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/arcade-post-playtest-2026-09-08
      - uses: oven-sh/setup-bun@v2
      - name: Apply patch
        run: node scripts/applyPlinkoPostPlaytestPatch.mjs
      - name: Remove one-shot patch files
        run: rm scripts/applyPlinkoPostPlaytestPatch.mjs .github/workflows/apply-plinko-post-playtest-patch.yml
      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/arcade/PlinkoReference.tsx scripts/applyPlinkoPostPlaytestPatch.mjs .github/workflows/apply-plinko-post-playtest-patch.yml
          git commit -m "fix: improve Plinko multiball pacing and status"
          git push origin HEAD:fix/arcade-post-playtest-2026-09-08
