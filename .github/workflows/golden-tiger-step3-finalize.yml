name: Golden Tiger Step 3 Finalize

on:
  push:
    branches: [art/premium-direction-2026-09-09]
    paths:
      - .github/workflows/golden-tiger-step3-finalize.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: art/premium-direction-2026-09-09

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply Step 3 finalization
        shell: bash
        run: |
          git apply --check .github/patches/golden-tiger-step3-finalization.diff
          git apply .github/patches/golden-tiger-step3-finalization.diff
          git diff --check
          node --check scripts/goldenTigerDesktopSpinQa.mjs

      - name: Typecheck
        run: bun run typecheck

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "danilo760"
          git config user.email "62104537+danilo760@users.noreply.github.com"
          git add \
            scripts/goldenTigerDesktopSpinQa.mjs \
            src/components/arcade/GoldenTigerCommercial.css \
            src/components/arcade/GoldenTigerPremium.tsx \
            src/components/arcade/golden-tiger/GoldenTigerScene25D.tsx
          git commit -m "polish: finalize Golden Tiger commercial scene"
          git push origin HEAD:art/premium-direction-2026-09-09
