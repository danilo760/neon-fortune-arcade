name: Apply Golden render isolation

on:
  push:
    branches: [perf/golden-render-cost]
    paths:
      - scripts/apply-golden-render-isolation.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: python3 scripts/apply-golden-render-isolation.py
      - run: git diff --check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Commit validated source change
        run: |
          if git diff --quiet -- src/components/arcade/GoldenTigerReference.tsx src/components/arcade/GoldenTigerReference.css; then
            echo 'No product diff to commit'
            exit 0
          fi
          git config user.name 'danilo760'
          git config user.email '62104537+danilo760@users.noreply.github.com'
          git add src/components/arcade/GoldenTigerReference.tsx src/components/arcade/GoldenTigerReference.css
          git commit -m 'perf: reduce Golden Tiger reel render cost'
          git push origin HEAD:perf/golden-render-cost
