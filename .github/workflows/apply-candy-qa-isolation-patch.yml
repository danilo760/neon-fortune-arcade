name: Apply Candy QA isolation patch

on:
  push:
    branches:
      - fix/arcade-post-playtest-2026-09-08
    paths:
      - ".github/workflows/apply-candy-qa-isolation-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/arcade-post-playtest-2026-09-08
      - name: Remove global Math.random override
        shell: python
        run: |
          from pathlib import Path
          p = Path("scripts/candyCascadeDesktopMotionQa.mjs")
          s = p.read_text()
          old = '''      source: `(() => {
        const state = { queue: [], fallback: .43, calls: 0 };
        Object.defineProperty(window, '__candyQaRandom', { value: state, configurable: true });
        Math.random = () => {
          state.calls += 1;
          return state.queue.length ? state.queue.shift() : state.fallback;
        };
      })();`,
'''
          new = '''      source: `(() => {
        const state = { queue: [], fallback: .43, calls: 0 };
        Object.defineProperty(window, '__candyQaRandom', { value: state, configurable: true });
      })();`,
'''
          if old not in s: raise SystemExit("Candy global RNG override anchor missing")
          p.write_text(s.replace(old, new, 1))
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-candy-qa-isolation-patch.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/candyCascadeDesktopMotionQa.mjs .github/workflows/apply-candy-qa-isolation-patch.yml
          git commit -m "test: isolate Candy deterministic RNG queue"
          git push origin HEAD:fix/arcade-post-playtest-2026-09-08
