name: Live Five Game Audit

on:
  push:
    branches:
      - audit/live-five-games-final

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install puppeteer-core
        run: npm install --no-save --ignore-scripts puppeteer-core@24.16.0
      - name: Locate Chrome
        run: |
          if command -v google-chrome >/dev/null; then echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV";
          elif command -v google-chrome-stable >/dev/null; then echo "CHROME_PATH=$(command -v google-chrome-stable)" >> "$GITHUB_ENV";
          elif command -v chromium >/dev/null; then echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV";
          else echo "Chrome not found"; exit 1; fi
      - name: Play and audit all five live games
        run: node scripts/audit-live-five-games.mjs
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-five-games-audit
          path: audit-artifacts
          retention-days: 3
