name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck scripts
        run: bun run typecheck:scripts

      - name: Golden Tiger simulator smoke test
        run: SPINS=2500 FEATURE_ENTRIES=500 SEEDS=20260910 BETS=20 bun run simulate:golden-tiger > /tmp/golden-tiger-sim.json

      - name: Production build
        run: bun run build
