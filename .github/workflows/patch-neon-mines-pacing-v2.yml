name: Patch Neon Mines Pacing V2
on:
  push:
    branches: [feat/neon-mines-pacing]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply patch
        run: |
          python3 scripts/patch-neon-mines-pacing.py
          python3 scripts/fix-neon-mines-import.py
      - name: Verify Mines math is byte-identical
        run: test "$(git hash-object src/lib/arcade/mines.ts)" = "2015ddf72b0d148a06d32277a751a87bc005b90e"
      - name: Install
        run: npm install --ignore-scripts
      - name: Tests
        run: npm test -- --run
      - name: TypeScript
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit validated product patch
        run: |
          git config user.name "danilo760"
          git config user.email "62104537+danilo760@users.noreply.github.com"
          git add src/components/arcade/MinesGame.tsx src/components/arcade/MinesInteraction.css src/components/arcade/MinesOrchestration.css src/components/arcade/MinesPremium.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "perf: tighten neon mines reveal pacing"
          git push origin HEAD:feat/neon-mines-pacing