name: Apply Golden Tiger Pass 4

on:
  push:
    branches:
      - art/golden-tiger-cabinet-pass4-2026-09-10
    paths:
      - .github/workflows/apply-golden-tiger-pass4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: art/golden-tiger-cabinet-pass4-2026-09-10
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply visual patch
        run: |
          git apply --check .step4-golden-tiger.patch
          git apply .step4-golden-tiger.patch

      - name: Install dependencies
        run: npm install --include=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit validated pass 4
        run: |
          git config user.name "danilo760"
          git config user.email "62104537+danilo760@users.noreply.github.com"
          git rm .step4-golden-tiger.patch .github/workflows/apply-golden-tiger-pass4.yml
          git add src/components/arcade/GoldenTigerPremium.tsx src/components/arcade/GoldenTigerCommercial.css scripts/goldenTigerDesktopSpinQa.mjs scripts/goldenTigerVisualQa.mjs
          git commit -m "refactor: reshape Golden Tiger cabinet into continuous reels"
          git push origin HEAD:art/golden-tiger-cabinet-pass4-2026-09-10
