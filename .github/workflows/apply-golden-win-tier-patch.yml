name: Apply Golden Tiger win tier patch

on:
  push:
    branches:
      - fix/arcade-post-playtest-2026-09-08
    paths:
      - ".github/workflows/apply-golden-win-tier-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/arcade-post-playtest-2026-09-08
          fetch-depth: 0

      - name: Apply exact Golden Tiger tier patch
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          function patch(file, replacements) {
            let source = fs.readFileSync(file, 'utf8');
            for (const [before, after] of replacements) {
              const first = source.indexOf(before);
              if (first < 0) throw new Error(`${file}: fragment not found: ${before}`);
              if (source.indexOf(before, first + before.length) >= 0) throw new Error(`${file}: fragment not unique: ${before}`);
              source = source.slice(0, first) + after + source.slice(first + before.length);
            }
            fs.writeFileSync(file, source);
          }

          patch('src/lib/arcade/goldenTigerMath.ts', [
            ['export type GoldenTigerWinTier = "none" | "small" | "nice" | "big" | "mega";', 'export type GoldenTigerWinTier = "none" | "small" | "nice" | "big" | "mega" | "super";'],
            [
              '  if (payout < bet * 15) return "nice";\n  if (payout < bet * 30) return "big";\n  return "mega";',
              '  if (payout < bet * 20) return "nice";\n  if (payout < bet * 35) return "big";\n  if (payout < bet * 50) return "mega";\n  return "super";'
            ],
          ]);

          patch('src/lib/arcade/goldenTigerAudio.ts', [
            ['export type GoldenTigerAudioWinTier = "small" | "nice" | "big" | "mega";', 'export type GoldenTigerAudioWinTier = "small" | "nice" | "big" | "mega" | "super";'],
            [
              '      if (event.tier === "big" || event.tier === "mega") {\n        return [{\n          name: "bigWin",\n          options: { intensity: event.tier === "mega" ? 1.12 : 1.02 },\n        }];\n      }',
              '      if (event.tier === "big" || event.tier === "mega" || event.tier === "super") {\n        return [{\n          name: "bigWin",\n          options: { intensity: event.tier === "super" ? 1.16 : event.tier === "mega" ? 1.12 : 1.02 },\n        }];\n      }'
            ],
          ]);

          patch('src/components/arcade/GoldenTigerReference.tsx', [
            [
              '      phase === "win" ? (winTier === "mega" ? 1.38 : winTier === "big" ? 1.28 : 1.12) :',
              '      phase === "win" ? (winTier === "super" ? 1.46 : winTier === "mega" ? 1.38 : winTier === "big" ? 1.28 : 1.12) :'
            ],
            [
              '        resolvedTier === "mega" ? 1600 :\n        resolvedTier === "big" ? 1280 :',
              '        resolvedTier === "super" ? 1900 :\n        resolvedTier === "mega" ? 1600 :\n        resolvedTier === "big" ? 1280 :'
            ],
            [
              '{((phase === "win" && (winTier === "big" || winTier === "mega")) || phase === "full-grid") && win > 0 && (',
              '{((phase === "win" && (winTier === "big" || winTier === "mega" || winTier === "super")) || phase === "full-grid") && win > 0 && ('
            ],
            [
              '          <div className={cn("gt-hw-win-overlay", phase === "full-grid" && "is-full", winTier === "mega" && "is-mega")}>',
              '          <div className={cn("gt-hw-win-overlay", phase === "full-grid" && "is-full", (winTier === "mega" || winTier === "super") && "is-mega", winTier === "super" && "is-super")}>'
            ],
            [
              '            <span>{phase === "full-grid" ? "TELA CHEIA" : winTier === "mega" ? "MEGA GANHO" : "GRANDE GANHO"}</span>',
              '            <span>{phase === "full-grid" ? "TELA CHEIA" : winTier === "super" ? "SUPER MEGA GANHO" : winTier === "mega" ? "MEGA GANHO" : "GRANDE GANHO"}</span>'
            ],
            [
              '            <AnimatedWinCounter value={win} duration={reducedMotion() ? 0 : phase === "full-grid" ? 1500 : winTier === "mega" ? 1300 : 950} />',
              '            <AnimatedWinCounter value={win} duration={reducedMotion() ? 0 : phase === "full-grid" ? 1500 : winTier === "super" ? 1600 : winTier === "mega" ? 1300 : 950} />'
            ],
          ]);
          NODE

      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-golden-win-tier-patch.yml

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "danilo760"
          git config user.email "62104537+danilo760@users.noreply.github.com"
          git add src/lib/arcade/goldenTigerMath.ts src/lib/arcade/goldenTigerAudio.ts src/components/arcade/GoldenTigerReference.tsx .github/workflows/apply-golden-win-tier-patch.yml
          git commit -m "feat: add Golden Tiger Super Mega win tier"
          git push origin HEAD:fix/arcade-post-playtest-2026-09-08
