name: Candy Sugar Party Gate
on:
  push:
    branches: [feat/candy-sugar-party]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply one-shot Candy calibration patches
        run: |
          node scripts/patch-candy-spin.mjs
          node scripts/patch-candy-meter.mjs
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'danilo760'
          git config user.email '62104537+danilo760@users.noreply.github.com'
          git add src/components/arcade/CandyCascadeHQ.tsx src/lib/arcade/candyCascadeMath.ts src/lib/arcade/candyCascadeMath.test.ts
          git commit -m 'fix: calibrate candy sugar meter progression'
          git push origin HEAD:feat/candy-sugar-party
      - run: npm install --ignore-scripts
      - run: npm test -- --run
      - run: npm run typecheck
      - run: npm run build
      - name: Simulate 1M base + 1M feature buys
        run: node --import tsx scripts/simulate-candy-sugar-party.ts
