name: Neon Plinko Visual

on:
  pull_request:
    paths:
      - "src/components/arcade/PlinkoReference.tsx"
      - "src/components/arcade/PlinkoReference.css"
      - "src/components/arcade/PlinkoInteraction.css"
      - "src/components/arcade/PlinkoPresentation.css"
      - "src/components/arcade/PlinkoPresentationSafe.css"
      - "src/lib/arcade/plinko.ts"
      - "src/routes/game/$slug.tsx"
      - "scripts/plinkoVisualQa.mjs"
      - ".github/workflows/neon-plinko-visual.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/arcade-consolidation-2026-09-08
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply controlled source cleanup
        if: github.event_name == 'pull_request' && github.head_ref == 'cleanup/arcade-consolidation-2026-09-08' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 occurrence, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once("src/components/arcade/MinesGame.tsx", 'import neonMinesReference from "@/assets/neon-mines-reference.webp";\n', "")
          replace_once("src/components/arcade/MinesGame.tsx", '        <img className="mines-premium__machine-art" src={neonMinesReference} alt="" aria-hidden />\n', "")
          replace_once("src/components/arcade/PlinkoReference.tsx", 'import neonPlinkoReference from "@/assets/neon-plinko-reference.webp";\n', "")
          replace_once("src/components/arcade/PlinkoReference.tsx", '        <img className="plinko-ref-machine__art" src={neonPlinkoReference} alt="Neon Plinko Skyfall Tower" draggable={false} />\n', "")

          replace_once(
              "src/components/arcade/GoldenTigerReference.tsx",
              '    ...finalSymbols,\n  ];\n\n  useEffect(() => {\n    brakingRef.current = braking;',
              '    ...finalSymbols,\n  ];\n  const finalSymbolsKey = finalSymbols.join("|");\n\n  useEffect(() => {\n    brakingRef.current = braking;',
          )
          replace_once(
              "src/components/arcade/GoldenTigerReference.tsx",
              '  }, [column, turbo, finalSymbols[0], finalSymbols[1], finalSymbols[2], symbols.length]);',
              '  }, [column, turbo, finalSymbolsKey, symbols.length]);',
          )

          p = Path("src/components/arcade/PlinkoReference.tsx")
          text = p.read_text()
          pattern = re.compile(r'  useEffect\(\(\) => \{\n    hydrateFromStorage\(\);.*?  \}, \[\]\);\n\n  useEffect\(\(\) => \{\n    setGameAmbience', re.S)
          replacement = '''  useEffect(() => {
    hydrateFromStorage();
    mountedRef.current = true;
    const activeAnimations = activeAnimationsRef.current;
    const pendingSettlements = pendingSettlementsRef.current;
    const settledOutcomeIds = settledOutcomeIdsRef.current;
    const balls = ballRefs.current;
    const trails = trailRefs.current;
    const impacts = impactRefs.current;

    return () => {
      mountedRef.current = false;
      autoRef.current = false;
      if (autoTimerRef.current !== null) {
        window.clearTimeout(autoTimerRef.current);
        autoTimerRef.current = null;
      }
      if (collisionRafRef.current !== null) {
        window.cancelAnimationFrame(collisionRafRef.current);
        collisionRafRef.current = null;
      }
      for (const animation of activeAnimations) animation.cancel();
      activeAnimations.clear();
      for (const ball of pendingSettlements.values()) {
        if (settledOutcomeIds.has(ball.id)) continue;
        settledOutcomeIds.add(ball.id);
        if (ball.payout > 0) arcadeActions.credit(ball.payout);
        arcadeActions.recordRound({
          slug: "neon-plinko",
          gameName: "Neon Plinko",
          bet: ball.bet,
          payout: ball.payout,
          multiplier: ball.multiplier,
          note: `Bola ${ball.ballNumber}/${ball.runBallCount} · Risco ${RISK_LABELS[ball.risk]} · ${ball.rows} linhas`,
        });
      }
      pendingSettlements.clear();
      settledOutcomeIds.clear();
      busyRef.current = false;
      balls.clear();
      trails.clear();
      impacts.clear();
    };
  }, []);

  useEffect(() => {
    setGameAmbience'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"Plinko mount cleanup: expected 1 effect block, found {count}")
          p.write_text(text)

          p = Path("eslint.config.js")
          text = p.read_text()
          marker = '  },\n);\n'
          if text.count(marker) != 1:
              raise SystemExit("eslint.config.js: unexpected config tail")
          p.write_text(text.replace(marker, '  },\n  {\n    files: ["src/components/ui/**/*.{ts,tsx}"],\n    rules: {\n      "react-refresh/only-export-components": "off",\n    },\n  },\n);\n', 1))

          replace_once("package.json", '    "lint": "eslint .",', '    "lint": "eslint . --max-warnings=0",')
          PY

      - name: Strict lint
        run: bun run lint
      - name: Tests
        run: bun run test
      - name: Typecheck
        run: bun run typecheck
      - name: Production build
        shell: bash
        run: |
          set -euo pipefail
          bun run build 2>&1 | tee /tmp/arcade-build.log
          ! grep -q 'neon-mines-reference' /tmp/arcade-build.log
          ! grep -q 'neon-plinko-reference' /tmp/arcade-build.log
      - name: Detect Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          [ -n "$CHROME" ] || { echo "No Chrome/Chromium binary" >&2; exit 1; }
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
      - name: Start production server
        shell: bash
        run: |
          set -euo pipefail
          PORT=3000 node .output/server/index.mjs > neon-plinko-server.log 2>&1 &
          echo $! > /tmp/neon-plinko-server.pid
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/game/neon-plinko >/dev/null && exit 0
            sleep 1
          done
          cat neon-plinko-server.log
          exit 1
      - name: Start headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9226 \
            --user-data-dir=/tmp/neon-plinko-chrome about:blank > neon-plinko-chrome.log 2>&1 &
          echo $! > /tmp/neon-plinko-chrome.pid
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9226/json/version >/dev/null && exit 0
            sleep 1
          done
          cat neon-plinko-chrome.log
          exit 1
      - name: Audit generated peg field
        run: node scripts/plinkoVisualQa.mjs
      - name: Commit validated source cleanup
        if: github.event_name == 'pull_request' && github.head_ref == 'cleanup/arcade-consolidation-2026-09-08' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/arcade/MinesGame.tsx src/components/arcade/PlinkoReference.tsx src/components/arcade/GoldenTigerReference.tsx eslint.config.js package.json
          git diff --cached --check
          git commit -m "refactor: remove legacy arcade bitmap path and lint warnings"
          git push origin HEAD:cleanup/arcade-consolidation-2026-09-08
      - name: Stop processes
        if: always()
        shell: bash
        run: |
          [ ! -f /tmp/neon-plinko-chrome.pid ] || kill "$(cat /tmp/neon-plinko-chrome.pid)" 2>/dev/null || true
          [ ! -f /tmp/neon-plinko-server.pid ] || kill "$(cat /tmp/neon-plinko-server.pid)" 2>/dev/null || true
