name: Patch Candy Meter Thresholds
on:
  push:
    branches: [feat/candy-sugar-party]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'fix: calibrate candy sugar meter progression'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply measured Sugar Meter thresholds
        run: |
          python - <<'PY'
          from pathlib import Path
          math = Path('src/lib/arcade/candyCascadeMath.ts')
          text = math.read_text()
          old = 'export const CANDY_SUGAR_LEVEL_THRESHOLDS = [0, 1, 3, 6, 10] as const;'
          new = '''// 1,000,000-feature energy analysis: P(E>=1)=58.14%, >=2=22.83%,
// >=3=6.91%, >=4=1.74%. These thresholds keep all five levels meaningful
// while leaving Level 5 uncommon rather than practically unreachable.
export const CANDY_SUGAR_LEVEL_THRESHOLDS = [0, 1, 2, 3, 4] as const;'''
          if old not in text:
              raise SystemExit('old threshold line not found')
          math.write_text(text.replace(old, new, 1))

          test = Path('src/lib/arcade/candyCascadeMath.test.ts')
          t = test.read_text()
          old_test = '''  assert.equal(candySugarLevel(0), 1);
  assert.equal(candySugarLevel(1), 2);
  assert.equal(candySugarLevel(3), 3);
  assert.equal(candySugarLevel(6), 4);
  assert.equal(candySugarLevel(10), 5);'''
          new_test = '''  assert.equal(candySugarLevel(0), 1);
  assert.equal(candySugarLevel(1), 2);
  assert.equal(candySugarLevel(2), 3);
  assert.equal(candySugarLevel(3), 4);
  assert.equal(candySugarLevel(4), 5);'''
          if old_test not in t:
              raise SystemExit('old level assertions not found')
          test.write_text(t.replace(old_test, new_test, 1))
          PY
      - name: Commit calibrated thresholds
        run: |
          git config user.name 'danilo760'
          git config user.email '62104537+danilo760@users.noreply.github.com'
          git add src/lib/arcade/candyCascadeMath.ts src/lib/arcade/candyCascadeMath.test.ts
          git commit -m 'fix: calibrate candy sugar meter progression'
          git push origin HEAD:feat/candy-sugar-party
