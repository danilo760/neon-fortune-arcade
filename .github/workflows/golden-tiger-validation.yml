name: Golden Tiger validation

on:
  push:
    branches:
      - codex/golden-tiger-complete-refinement

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Simulate Golden Tiger
        env:
          SPINS: 1000000
        run: bun scripts/simulate-golden-tiger.ts
