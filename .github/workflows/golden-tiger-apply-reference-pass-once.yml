name: Golden Tiger Apply Reference Pass Once

on:
  push:
    branches:
      - feature/mx44-tigrinho-integration
    paths:
      - ".github/workflows/golden-tiger-apply-reference-pass-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/mx44-tigrinho-integration
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/tmp-goldenTigerReferencePass.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/arcade/GoldenTigerPremium.tsx src/components/arcade/GoldenTigerPremium.css src/lib/arcade/goldenTigerMotion.ts src/lib/arcade/goldenTigerWinTimeline.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(golden-tiger): match reference controls and slow presentation"
          git push origin HEAD:feature/mx44-tigrinho-integration
