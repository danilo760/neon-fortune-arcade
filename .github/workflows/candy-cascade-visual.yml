name: Candy Cascade Visual

on:
  pull_request:
    paths:
      - "src/components/arcade/CandyCascadeHQ.tsx"
      - "src/components/arcade/CandyCascadeReference.css"
      - "src/components/arcade/CandyCascadePresentation.css"
      - "src/components/arcade/CandyCascadeOrchestration.css"
      - "src/lib/arcade/candyCascade*.ts"
      - "src/lib/arcade/candySound.ts"
      - "src/routes/game/$slug.tsx"
      - "scripts/candyCascadeVisualQa.mjs"
      - ".github/workflows/candy-cascade-visual.yml"
  workflow_dispatch:

jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Production build
        run: bun run build
      - name: Detect Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          [ -n "$CHROME" ] || { echo "No Chrome/Chromium binary" >&2; exit 1; }
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
      - name: Start production server
        shell: bash
        run: |
          set -euo pipefail
          PORT=3000 node .output/server/index.mjs > candy-cascade-server.log 2>&1 &
          echo $! > /tmp/candy-server.pid
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/game/candy-cascade >/dev/null && exit 0
            sleep 1
          done
          cat candy-cascade-server.log
          exit 1
      - name: Start headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9224 \
            --user-data-dir=/tmp/candy-cascade-chrome about:blank > candy-cascade-chrome.log 2>&1 &
          echo $! > /tmp/candy-chrome.pid
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9224/json/version >/dev/null && exit 0
            sleep 1
          done
          cat candy-cascade-chrome.log
          exit 1
      - name: Audit mobile baseline
        run: node scripts/candyCascadeVisualQa.mjs
      - name: Stop processes
        if: always()
        shell: bash
        run: |
          [ ! -f /tmp/candy-chrome.pid ] || kill "$(cat /tmp/candy-chrome.pid)" 2>/dev/null || true
          [ ! -f /tmp/candy-server.pid ] || kill "$(cat /tmp/candy-server.pid)" 2>/dev/null || true
