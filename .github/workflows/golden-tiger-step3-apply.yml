name: Golden Tiger Step 3 Apply

on:
  push:
    branches: [art/premium-direction-2026-09-09]
    paths:
      - .github/workflows/golden-tiger-step3-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: art/premium-direction-2026-09-09

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply cinematic presentation refactor
        shell: bash
        run: |
          cat <<'PATCH64' | base64 -d > /tmp/golden-tiger-step3.diff

          PATCH64
          git apply --check /tmp/golden-tiger-step3.diff
          git apply /tmp/golden-tiger-step3.diff
          git diff --check

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Production build
        run: bun run build

      - name: Commit source change
        shell: bash
        run: |
          git config user.name "danilo760"
          git config user.email "62104537+danilo760@users.noreply.github.com"
          git add src/components/arcade/GoldenTigerPremium.tsx \
            src/components/arcade/golden-tiger/GoldenTigerWinStage.tsx \
            src/lib/arcade/goldenTigerWinTimeline.ts \
            src/components/arcade/GoldenTigerCommercial.css \
            scripts/goldenTigerSpecialStateQa.mjs
          git commit -m "refactor: connect Golden Tiger commercial win staging"
          git push origin HEAD:art/premium-direction-2026-09-09
