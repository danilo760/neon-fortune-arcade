name: Golden Tiger Step 3 Apply V2

on:
  push:
    branches: [art/premium-direction-2026-09-09]
    paths:
      - .github/workflows/golden-tiger-step3-apply-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: art/premium-direction-2026-09-09

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply step 3 refactor
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          premium = Path('src/components/arcade/GoldenTigerPremium.tsx')
          s = premium.read_text()
          s = s.replace('import { GoldenTigerSymbol } from "./golden-tiger/GoldenTigerSymbols";\n', 'import { GoldenTigerScene25D, type GoldenTigerLightingMode } from "./golden-tiger/GoldenTigerScene25D";\nimport { GoldenTigerSymbol } from "./golden-tiger/GoldenTigerSymbols";\n', 1)
          s = s.replace('import { GoldenTigerTigerStage, type TigerReactionState } from "./golden-tiger/GoldenTigerTigerStage";\n', 'import { GoldenTigerTigerStage, type TigerReactionState } from "./golden-tiger/GoldenTigerTigerStage";\nimport { GoldenTigerWinStage } from "./golden-tiger/GoldenTigerWinStage";\n', 1)
          s = s.replace('import { setAmbienceEnergy, setGameAmbience } from "@/lib/arcade/sound";\n', 'import { goldenTigerSettleHoldMs, goldenTigerWinTimeline, type GoldenTigerWinBeat } from "@/lib/arcade/goldenTigerWinTimeline";\nimport { setAmbienceEnergy, setGameAmbience } from "@/lib/arcade/sound";\n', 1)
          s = s.replace('import "./GoldenTigerReference.css";\nimport "./GoldenTigerPremiumArt.css";\n', 'import "./GoldenTigerCommercial.css";\n', 1)
          s = s.replace('  const [winTier, setWinTier] = useState<GoldenTigerWinTier>("none");\n', '  const [winTier, setWinTier] = useState<GoldenTigerWinTier>("none");\n  const [winBeat, setWinBeat] = useState<GoldenTigerWinBeat>(null);\n', 1)

          old_reaction = '''  const tigerReaction: TigerReactionState =\n    phase === "full-grid" ? "full" :\n    phase === "bonus-intro" || phase === "feature-intro" || phase === "feature-lock" || phase === "feature-outro" ? "feature" :\n    anticipating || (featureActive && lockedCount >= 6) ? "tense" :\n    phase === "reveal" ? "reveal" :\n    phase === "base-spin" || phase === "feature-spin" ? "watch" :\n    phase === "win" ? "win" : "idle";\n\n'''
          new_reaction = '''  const tigerReaction: TigerReactionState =\n    phase === "full-grid" && winBeat ? (winBeat === "celebrate" ? "full" : winBeat === "impact" ? "reveal" : "tense") :\n    phase === "win" && winBeat ? (winBeat === "celebrate" ? "win" : winBeat === "impact" ? "reveal" : "tense") :\n    phase === "bonus-intro" || phase === "feature-intro" || phase === "feature-lock" || phase === "feature-outro" ? "feature" :\n    anticipating || (featureActive && lockedCount >= 6) ? "tense" :\n    phase === "reveal" ? "reveal" :\n    phase === "base-spin" || phase === "feature-spin" ? "watch" :\n    phase === "win" ? "win" : phase === "full-grid" ? "full" : "idle";\n\n  const sceneLighting: GoldenTigerLightingMode =\n    phase === "full-grid" ? "full" :\n    phase === "win" ? "win" :\n    featureActive ? "feature" :\n    phase === "base-spin" ? "spin" : "idle";\n\n'''
          assert old_reaction in s
          s = s.replace(old_reaction, new_reaction, 1)

          old_settle = '''    if (fullGrid) {\n      setPhase("full-grid");\n      playGoldenTigerAudio({ type: "full-grid" }, soundEnabled);\n      await wait(turbo ? 680 : 2100);\n    } else if (payout > visualStake) {\n      setPhase("win");\n      playGoldenTigerAudio({\n        type: "win",\n        tier: resolvedTier === "none" ? "small" : resolvedTier,\n      }, soundEnabled);\n      await wait(\n        turbo ? 280 :\n        resolvedTier === "super" ? 2000 :\n        resolvedTier === "mega" ? 1700 :\n        resolvedTier === "big" ? 1350 : 650,\n      );\n    } else if (payout > 0) {\n      setPhase("return");\n      await wait(turbo ? 90 : 260);\n    } else {\n      playGoldenTigerAudio({ type: "lose" }, soundEnabled);\n      await wait(turbo ? 70 : 170);\n    }\n'''
          new_settle = '''    const cinematicWin = fullGrid || resolvedTier === "big" || resolvedTier === "mega" || resolvedTier === "super";\n\n    if (cinematicWin) {\n      const timeline = goldenTigerWinTimeline(turbo, fullGrid);\n      setPhase(fullGrid ? "full-grid" : "win");\n      playGoldenTigerAudio(\n        fullGrid\n          ? { type: "full-grid" }\n          : { type: "win", tier: resolvedTier === "none" ? "small" : resolvedTier },\n        soundEnabled,\n      );\n\n      setWinBeat("impact");\n      await wait(timeline.impactMs);\n      setWinBeat("reveal");\n      await wait(timeline.revealMs);\n      setWinBeat("celebrate");\n      await wait(timeline.celebrateMs);\n      setWinBeat(null);\n    } else if (payout > visualStake) {\n      setPhase("win");\n      playGoldenTigerAudio({\n        type: "win",\n        tier: resolvedTier === "none" ? "small" : resolvedTier,\n      }, soundEnabled);\n      await wait(goldenTigerSettleHoldMs("simple-win", turbo));\n    } else if (payout > 0) {\n      setPhase("return");\n      await wait(goldenTigerSettleHoldMs("return", turbo));\n    } else {\n      playGoldenTigerAudio({ type: "lose" }, soundEnabled);\n      await wait(goldenTigerSettleHoldMs("lose", turbo));\n    }\n'''
          assert old_settle in s
          s = s.replace(old_settle, new_settle, 1)
          s = s.replace('    setWinTier("none");\n', '    setWinTier("none");\n    setWinBeat(null);\n', 1)
          s = s.replace('  const finishRoundPresentation = useCallback(() => {\n    setPhase("idle");\n', '  const finishRoundPresentation = useCallback(() => {\n    setWinBeat(null);\n    setPhase("idle");\n', 1)

          old_scene = '''        data-anticipating={anticipating ? "true" : "false"}\n        aria-label="Golden Tiger"\n      >\n        <div className="gt-hw-backdrop gt-premium-backdrop" aria-hidden />\n        <div className="gt-premium-temple" aria-hidden><i /><i /><i /></div>\n        <div className="gt-premium-lanterns" aria-hidden><i /><i /><i /><i /></div>\n        <div className="gt-hw-ambient" aria-hidden>\n          {Array.from({ length: 14 }, (_, index) => <i key={index} />)}\n        </div>\n'''
          new_scene = '''        data-anticipating={anticipating ? "true" : "false"}\n        data-win-beat={winBeat ?? "none"}\n        aria-label="Golden Tiger"\n      >\n        <GoldenTigerScene25D lighting={sceneLighting} />\n'''
          assert old_scene in s
          s = s.replace(old_scene, new_scene, 1)

          s = s.replace('{locked && <span className="gt-premium-lock-ring" aria-hidden />}', '{locked && (\n                  <span className="gt-premium-lock-ring" aria-hidden>\n                    {freshCells.has(index) && <><i /><i /><i /><i /></>}\n                  </span>\n                )}', 1)

          old_overlay = '''        {((phase === "win" && (winTier === "big" || winTier === "mega" || winTier === "super")) || phase === "full-grid") && win > 0 && (\n          <div className={cn(\n            "gt-hw-win-overlay",\n            phase === "full-grid" && "is-full",\n            (winTier === "mega" || winTier === "super") && "is-mega",\n            winTier === "super" && "is-super",\n          )}>\n            <div className="gt-hw-win-rays" aria-hidden />\n            <div className="gt-hw-win-crown" aria-hidden>✦</div>\n            <span>{phase === "full-grid" ? "TELA CHEIA" : winTier === "super" ? "SUPER MEGA GANHO" : winTier === "mega" ? "MEGA GANHO" : "GRANDE GANHO"}</span>\n            <AnimatedWinCounter value={win} duration={reducedMotion() ? 0 : 1500} />\n            {phase === "full-grid" && <small>GANHOS × {FORTUNE_FEATURE_FULL_GRID_MULTIPLIER}</small>}\n          </div>\n        )}\n'''
          new_overlay = '''        {((phase === "win" && (winTier === "big" || winTier === "mega" || winTier === "super")) || phase === "full-grid") && win > 0 && winBeat && (\n          <GoldenTigerWinStage\n            value={win}\n            tier={winTier}\n            fullGrid={phase === "full-grid"}\n            beat={winBeat}\n            countUpMs={goldenTigerWinTimeline(turbo, phase === "full-grid").revealMs}\n            reducedMotion={reducedMotion()}\n          />\n        )}\n'''
          assert old_overlay in s
          s = s.replace(old_overlay, new_overlay, 1)
          premium.write_text(s)

          win_stage = Path('src/components/arcade/golden-tiger/GoldenTigerWinStage.tsx')
          s = win_stage.read_text()
          s = s.replace('  beat,\n  reducedMotion,\n', '  beat,\n  countUpMs,\n  reducedMotion,\n', 1)
          s = s.replace('  beat: GoldenTigerWinBeat;\n  reducedMotion: boolean;\n', '  beat: GoldenTigerWinBeat;\n  countUpMs: number;\n  reducedMotion: boolean;\n', 1)
          s = s.replace('<AnimatedWinCounter value={value} duration={reducedMotion ? 0 : 1450} />', '<AnimatedWinCounter value={beat === "impact" ? 0 : value} duration={reducedMotion ? 0 : countUpMs} />', 1)
          win_stage.write_text(s)

          timeline = Path('src/lib/arcade/goldenTigerWinTimeline.ts')
          s = timeline.read_text()
          assert 'goldenTigerSettleHoldMs' not in s
          s += '''\nexport type GoldenTigerSettlePresentation = "simple-win" | "return" | "lose";\n\nexport function goldenTigerSettleHoldMs(kind: GoldenTigerSettlePresentation, turbo: boolean) {\n  if (turbo) return kind === "simple-win" ? 280 : kind === "return" ? 90 : 70;\n  return kind === "simple-win" ? 650 : kind === "return" ? 260 : 170;\n}\n'''
          timeline.write_text(s)

          commercial = Path('src/components/arcade/GoldenTigerCommercial.css')
          s = commercial.read_text()
          s = s.replace('@import "./GoldenTigerSession2Polish.css";', '@import "./GoldenTigerReference.css";\n@import "./GoldenTigerPremiumArt.css";\n@import "./GoldenTigerSession2Polish.css";', 1)
          s = s.replace('[data-phase="feature-lock"] .gt-hw-cell.is-fresh', '[data-feature-mode="active"] .gt-hw-cell.is-fresh')
          needle = '/* Three-beat win staging; legacy ray/bloom takeover is retired. */'
          extra = '''.gt-hw-page .gt-premium-machine[data-feature-mode="active"] .gt-hw-cell.is-fresh .gt-hw-symbol-raster {\n  opacity: .78;\n  filter: brightness(.92) saturate(.96) !important;\n}\n\n.gt-hw-page .gt-premium-machine .gt-premium-lock-ring > i {\n  position: absolute;\n  z-index: 2;\n  left: 50%;\n  top: 50%;\n  width: 4px;\n  height: 4px;\n  margin: -2px;\n  border-radius: 50%;\n  background: #fff0ac;\n  box-shadow: 0 0 7px rgba(255,190,54,.86);\n  opacity: 0;\n}\n.gt-hw-page .gt-premium-machine[data-feature-mode="active"] .gt-hw-cell.is-fresh .gt-premium-lock-ring > i {\n  animation: gt-commercial-lock-spark .46s cubic-bezier(.16,.72,.28,1) both;\n}\n.gt-hw-page .gt-premium-machine .gt-premium-lock-ring > i:nth-child(1) { --gt-lock-x: -24px; --gt-lock-y: -19px; }\n.gt-hw-page .gt-premium-machine .gt-premium-lock-ring > i:nth-child(2) { --gt-lock-x: 25px; --gt-lock-y: -17px; animation-delay: 35ms; }\n.gt-hw-page .gt-premium-machine .gt-premium-lock-ring > i:nth-child(3) { --gt-lock-x: -22px; --gt-lock-y: 21px; animation-delay: 55ms; }\n.gt-hw-page .gt-premium-machine .gt-premium-lock-ring > i:nth-child(4) { --gt-lock-x: 23px; --gt-lock-y: 20px; animation-delay: 75ms; }\n\n.gt-hw-page .gt-premium-machine[data-win-beat="impact"] {\n  animation: gt-commercial-machine-impact .22s cubic-bezier(.2,.7,.2,1) both;\n}\n\n'''
          assert needle in s
          s = s.replace(needle, extra + needle, 1)
          s += '''\n@keyframes gt-commercial-lock-spark {\n  0% { opacity: 0; transform: translate(0,0) scale(.4); }\n  22% { opacity: 1; }\n  100% { opacity: 0; transform: translate(var(--gt-lock-x),var(--gt-lock-y)) scale(1.1); }\n}\n@keyframes gt-commercial-machine-impact {\n  0%,100% { transform: translate3d(0,0,0); }\n  22% { transform: translate3d(-2px,1px,0); }\n  44% { transform: translate3d(2px,-1px,0); }\n  68% { transform: translate3d(-1px,0,0); }\n}\n'''
          commercial.write_text(s)

          qa = Path('scripts/goldenTigerSpecialStateQa.mjs')
          s = qa.read_text()
          s = s.replace("const overlay = document.querySelector('.gt-hw-win-overlay');", "const overlay = document.querySelector('.gt-commercial-win');", 1)
          s = s.replace("      overlayMega: overlay?.classList.contains('is-mega') ?? false,\n", "      overlayMega: overlay?.classList.contains('is-mega') ?? false,\n      winBeat: overlay?.getAttribute('data-win-beat') ?? null,\n", 1)
          s = s.replace('async function capturePhase(client, scenario, phase, validate, timeoutMs = 12_000) {\n  await waitForPhase(client, phase, timeoutMs);\n  await sleep(42);\n', 'async function capturePhase(client, scenario, phase, validate, timeoutMs = 12_000, winBeat = null) {\n  await waitForPhase(client, phase, timeoutMs);\n  if (winBeat) {\n    await waitFor(client, `document.querySelector(\'.gt-commercial-win\')?.getAttribute(\'data-win-beat\') === ${JSON.stringify(winBeat)}`, `${scenario} ${winBeat} beat`, timeoutMs);\n  }\n  await sleep(42);\n', 1)
          s = s.replace('await screenshot(client, `${outputDir}/special-${scenario}-${phase}.png`);', 'await screenshot(client, `${outputDir}/special-${scenario}-${phase}${winBeat ? `-${winBeat}` : ""}.png`);', 1)
          start = s.index('{\n  const scenario = await openScenario("big-win", bigWinValues);')
          end = s.index('\n\nconst megaWinValues', start)
          block = '''{\n  const scenario = await openScenario("big-win", bigWinValues);\n  try {\n    for (const beat of ["impact", "reveal", "celebrate"]) {\n      report.push({ scenario: "big-win", state: `win-${beat}`, data: await capturePhase(\n        scenario.client,\n        "big-win",\n        "win",\n        (state) => {\n          requireState(state.overlay.includes("GRANDE GANHO"), `expected GRANDE GANHO overlay, got ${state.overlay}`);\n          requireState(!state.overlayFull, "big win incorrectly marked full-grid");\n          requireState(state.winBeat === beat, `big win expected ${beat} beat, got ${state.winBeat}`);\n        },\n        12_000,\n        beat,\n      ) });\n    }\n  } finally {\n    await closeScenario(scenario);\n  }\n}\n'''
          s = s[:start] + block + s[end:]
          s = s.replace('requireState(!state.overlayFull, "mega win incorrectly marked full-grid");', 'requireState(!state.overlayFull, "mega win incorrectly marked full-grid");\n        requireState(state.winBeat === "reveal", `mega win expected reveal beat, got ${state.winBeat}`);', 1)
          s = s.replace('requireState(state.winning === 9, `base full-grid should highlight 9 positions, got ${state.winning}`);', 'requireState(state.winning === 9, `base full-grid should highlight 9 positions, got ${state.winning}`);\n        requireState(state.winBeat === "reveal", `base full-grid expected reveal beat, got ${state.winBeat}`);', 1)
          s = s.replace('requireState(state.locked === 9, `feature full-grid should retain 9 sticky cells, got ${state.locked}`);', 'requireState(state.locked === 9, `feature full-grid should retain 9 sticky cells, got ${state.locked}`);\n        requireState(state.winBeat === "reveal", `feature full-grid expected reveal beat, got ${state.winBeat}`);', 1)

          targets = [
            ('const megaWinValues', 'const baseFullGridValues'),
            ('const baseFullGridValues', 'const featureFullGridValues'),
          ]
          for left, right in targets:
            a = s.index(left)
            b = s.index(right, a)
            segment = s[a:b]
            segment = segment.replace('      },\n    ) });', '      },\n      12_000,\n      "reveal",\n    ) });', 1)
            s = s[:a] + segment + s[b:]
          a = s.index('const featureFullGridValues')
          segment = s[a:]
          pos = segment.rfind('      },\n    ) });')
          assert pos != -1
          segment = segment[:pos] + segment[pos:].replace('      },\n    ) });', '      },\n      12_000,\n      "reveal",\n    ) });', 1)
          s = s[:a] + segment
          qa.write_text(s)
          PY

          node --check scripts/goldenTigerSpecialStateQa.mjs
          git diff --check

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Production build
        run: bun run build

      - name: Commit source change
        shell: bash
        run: |
          git config user.name "danilo760"
          git config user.email "62104537+danilo760@users.noreply.github.com"
          git add src/components/arcade/GoldenTigerPremium.tsx \
            src/components/arcade/golden-tiger/GoldenTigerWinStage.tsx \
            src/lib/arcade/goldenTigerWinTimeline.ts \
            src/components/arcade/GoldenTigerCommercial.css \
            scripts/goldenTigerSpecialStateQa.mjs
          git commit -m "refactor: connect Golden Tiger commercial win staging"
          git push origin HEAD:art/premium-direction-2026-09-09
