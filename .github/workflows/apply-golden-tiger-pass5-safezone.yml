name: Apply Golden Tiger Pass 5 Safe Zone

on:
  push:
    branches:
      - polish/golden-tiger-pass5-av-sync-2026-09-10
    paths:
      - .github/workflows/apply-golden-tiger-pass5-safezone.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/golden-tiger-pass5-av-sync-2026-09-10
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply safe-zone correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/arcade/GoldenTigerCommercial.css')
          text = path.read_text()
          old = '''@keyframes gt-p5-tiger-breathe {
            0%,100% { transform: translate3d(0,0,0) rotateZ(-.2deg) scale(1); }
            50% { transform: translate3d(0,-2px,0) rotateZ(.18deg) scale(1.012,1.018); }
          }'''
          new = '''@keyframes gt-p5-tiger-breathe {
            0%,100% { transform: translate3d(0,3px,0) rotateZ(-.2deg) scale(1); }
            50% { transform: translate3d(0,1px,0) rotateZ(.18deg) scale(1.012,1.018); }
          }'''
          # Normalize indentation only inside the exact keyframe block so this
          # replacement remains explicit and refuses unexpected source drift.
          old = '\n'.join(line.strip() if i else line for i, line in enumerate(old.splitlines()))
          new = '\n'.join(line.strip() if i else line for i, line in enumerate(new.splitlines()))
          canonical = text.replace('  0%,100% { transform: translate3d(0,0,0) rotateZ(-.2deg) scale(1); }\n  50% { transform: translate3d(0,-2px,0) rotateZ(.18deg) scale(1.012,1.018); }',
                                   '  0%,100% { transform: translate3d(0,3px,0) rotateZ(-.2deg) scale(1); }\n  50% { transform: translate3d(0,1px,0) rotateZ(.18deg) scale(1.012,1.018); }', 1)
          if canonical == text:
            raise SystemExit('Expected Pass 5 breathe keyframe was not found exactly once')
          path.write_text(canonical)
          PY
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Tests
        run: bun run test
      - name: Typecheck
        run: bun run typecheck
      - name: Production build
        run: bun run build
      - name: Commit validated safe-zone correction
        run: |
          git config user.name "danilo760"
          git config user.email "62104537+danilo760@users.noreply.github.com"
          git rm .pass5-safezone.patch .github/workflows/apply-golden-tiger-pass5-safezone.yml
          git add src/components/arcade/GoldenTigerCommercial.css
          git commit -m "fix: keep Golden Tiger idle mascot inside safe zone"
          git push origin HEAD:polish/golden-tiger-pass5-av-sync-2026-09-10
